<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards: FlagFlip y LandFlip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* VOICE: juego de mesa alegre, claro y directo para todas las edades
   IDEA: una baraja de cartas sobre un tapete: cada pregunta es una carta que se voltea
   PICTURE: la carta grande al centro (bandera o ilustración vectorial), opciones debajo
   COLOUR and TYPE: tapete cobalto, cartas blancas, amarillo FlagFlip, coral LandFlip; Fredoka + Nunito
   LAYOUT: barra con ruta, tablero centrado de una columna, resultados con repaso en rejilla */
:root{color-scheme:light dark;--bg:light-dark(#2944d6,#0f1640);--bg2:light-dark(#2139b8,#0a1032);--ink:#fff;--card:light-dark(#fff,#1c2353);--cink:light-dark(#151a3d,#eef0ff);--muted:light-dark(#5d6288,#a9aed6);--line:light-dark(#e4e7f3,#2e3672);--y:#ffd23f;--co:#ff7a59;--ok:#13a362;--bad:#e2434b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100vh;
 background-image:radial-gradient(circle at 20% 0%,rgba(255,255,255,.12),transparent 45%),radial-gradient(circle at 90% 100%,rgba(0,0,0,.18),transparent 50%)}
h1,h2,h3,.disp{font-family:Fredoka,Nunito,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px max(5vw,16px);background:var(--bg2)}
.logo{font:700 22px Fredoka,sans-serif;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:22px;height:28px;border-radius:5px;background:var(--y);transform:rotate(-10deg);box-shadow:8px 2px 0 -2px var(--co)}
.route{margin-left:auto;font:600 13px/1 ui-monospace,Menlo,monospace;background:rgba(255,255,255,.12);padding:8px 12px;border-radius:99px;white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(24px,4vw,56px) max(5vw,16px)}
/* inicio */
.hero h1{font-size:clamp(34px,6vw,52px)}
.hero p{font-size:17px;max-width:60ch;opacity:.9;margin:12px 0 0}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px;margin-top:32px}
.game{border-radius:28px;padding:24px;color:#161a3a;display:grid;gap:16px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.game.flag{background:var(--y)}.game.land{background:var(--co)}
.fan{height:200px;position:relative}
.fan .mini{position:absolute;top:20px;left:50%;width:150px;height:170px;margin-left:-75px;background:#fff;border-radius:16px;box-shadow:0 10px 24px rgba(0,0,0,.2);padding:12px;display:grid;place-items:center;transition:transform .4s}
.fan .mini svg{width:100%;border-radius:6px;display:block}
.fan .mini:nth-child(1){transform:rotate(-14deg) translateX(-70px)}
.fan .mini:nth-child(2){transform:rotate(0) translateY(-8px)}
.fan .mini:nth-child(3){transform:rotate(14deg) translateX(70px)}
.game:hover .mini:nth-child(1){transform:rotate(-18deg) translateX(-90px)}
.game:hover .mini:nth-child(3){transform:rotate(18deg) translateX(90px)}
.game h2{font-size:36px}
.game p{margin:0;font-size:16px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.facts li{background:rgba(255,255,255,.55);border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px}
.play{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border-radius:99px;border:0;background:#161a3a;color:#fff;font:600 18px Fredoka,sans-serif;text-decoration:none;justify-self:start}
.best{font-size:14px;font-weight:700;opacity:.8}
.arch{margin-top:40px;background:rgba(255,255,255,.08);border-radius:20px;padding:20px 24px}
.arch h3{font-size:20px;margin-bottom:10px}
.arch table{width:100%;border-collapse:collapse;font-size:15px}
.arch td,.arch th{text-align:left;padding:8px 10px;border-top:1px solid rgba(255,255,255,.15)}
.arch th{font-weight:800;border-top:0;opacity:.8}
.arch code{font-size:14px}
/* juego */
.board{max-width:560px;margin:0 auto;display:grid;gap:18px}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:99px;background:rgba(255,255,255,.14);text-decoration:none;font-weight:700}
.hud h1{font-size:28px}
.score{margin-left:auto;background:var(--accent);color:#161a3a;border-radius:16px;padding:6px 14px;text-align:center;font-weight:800;line-height:1.1}
.score b{display:block;font:700 26px Fredoka,sans-serif}
.score.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.2)}}
.prog{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.dots{display:flex;gap:6px;flex:1}
.dots span{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.2)}
.dots .ok{background:var(--ok)}.dots .bad{background:var(--bad)}.dots .now{background:var(--accent)}
.stage{perspective:1400px}
.card{position:relative;height:380px;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.2,.8,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.card.enter{animation:deal .45s ease-out}
@keyframes deal{from{transform:translateX(60px) rotate(6deg);opacity:0}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;background:var(--card);color:var(--cink);box-shadow:0 22px 44px rgba(0,0,0,.3);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;border:6px solid var(--accent)}
.face.backf{transform:rotateY(180deg);color:#fff;border-color:rgba(255,255,255,.35)}
.backf.ok{background:var(--ok)}.backf.bad{background:var(--bad)}
.flagbox{width:min(260px,80%);aspect-ratio:3/2;border-radius:10px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.18),inset 0 0 0 1px rgba(0,0,0,.08)}
.flagbox svg,.scene svg{width:100%;height:100%;display:block}
.scene{width:100%;aspect-ratio:200/140;max-height:250px;border-radius:16px;overflow:hidden}
.face .name{font:700 32px Fredoka,sans-serif}
.face .q{color:var(--muted);font-weight:700;margin:0}
.face .tag{font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--muted)}
.backf .ico{width:64px;height:64px}
.backf .verdict{font:700 34px Fredoka,sans-serif}
.backf .ans{font-size:17px;margin:0}
.backf .ans b{display:block;font:700 30px Fredoka,sans-serif;margin-top:4px}
.backf .pts{background:rgba(255,255,255,.2);border-radius:99px;padding:4px 14px;font-weight:800}
.backf .mini-flag{width:90px;aspect-ratio:3/2;border-radius:5px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.opts{display:grid;gap:10px}
.opt{min-height:56px;border-radius:16px;border:0;background:var(--card);color:var(--cink);font-weight:800;font-size:17px;display:flex;align-items:center;gap:12px;padding:0 16px;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .15s,background .2s}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt kbd{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--line);font:700 15px Fredoka,sans-serif;flex:none}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok);color:#fff}.opt.wrong{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.next{min-height:52px;border:0;border-radius:99px;background:var(--accent);color:#161a3a;font:600 19px Fredoka,sans-serif;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.next[hidden]{display:none}
.hint{text-align:center;font-size:13px;opacity:.7;margin:0}
/* resultados */
.res{text-align:center;display:grid;gap:14px;justify-items:center}
.medal{width:190px;height:190px;border-radius:50%;background:var(--accent);color:#161a3a;display:grid;place-content:center;box-shadow:0 0 0 12px rgba(255,255,255,.12),0 20px 40px rgba(0,0,0,.3)}
.medal b{font:700 64px/1 Fredoka,sans-serif}.medal span{font-weight:800}
.res h2{font-size:clamp(32px,5vw,44px)}
.res .sub{margin:0;font-size:17px;opacity:.9}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ghost{background:rgba(255,255,255,.14);color:#fff}
.review{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px;width:100%;margin-top:12px;text-align:left}
.rv{background:var(--card);color:var(--cink);border-radius:16px;padding:12px;display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;border-left:6px solid var(--ok)}
.rv.bad{border-left-color:var(--bad)}
.rv .th{width:64px;aspect-ratio:3/2;border-radius:6px;overflow:hidden}
.rv .th svg{width:100%;height:100%;display:block}
.rv b{display:block;font-size:15px}.rv small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.foot{padding:24px max(5vw,16px) 40px;text-align:center;font-size:13px;opacity:.7}
@media(max-width:600px){.card{height:350px}.face .name{font-size:26px}.fan{height:180px}.fan .mini{width:120px;height:140px;margin-left:-60px}.hud h1{font-size:22px}}
@media(prefers-reduced-motion:reduce){.card,.fan .mini,.opt{transition:none}.card.enter,.score.bump{animation:none}}
</style>
</head>

<script>
{

const R=(x,y,w,h,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
const C=(x,y,r,f)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`;
const P=(p,f)=>`<polygon points="${p}" fill="${f}"/>`;
const S=(x,y,r,f)=>{x=+x;y=+y;const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.4:r;p.push((x+q*Math.cos(a)).toFixed(2)+','+(y+q*Math.sin(a)).toFixed(2))}return P(p.join(' '),f)};
const Pent=(x,y,r,s)=>{const p=[];for(let i=0;i<5;i++){const a=-Math.PI/2+i*4*Math.PI/5;p.push((x+r*Math.cos(a)).toFixed(2)+','+(y+r*Math.sin(a)).toFixed(2))}return `<polygon points="${p.join(' ')}" fill="none" stroke="${s}" stroke-width=".7"/>`};
const H=(c,w)=>{w=w||c.map(()=>1);const t=w.reduce((a,b)=>a+b,0);let y=0;return c.map((f,i)=>{const h=20*w[i]/t,r=R(0,y.toFixed(3),30,(h+.05).toFixed(3),f);y+=h;return r}).join('')};

const ST=(n,a,b)=>H(Array.from({length:n},(_,i)=>i%2?b:a));
const N=(bg,cr,inn)=>R(0,0,30,20,bg)+R(8,0,4,20,cr)+R(0,8,30,4,cr)+(inn?R(9,0,2,20,inn)+R(0,9,30,2,inn):'');
const TG=(x,y,a)=>`<g transform="translate(${x} ${y}) rotate(${a})">${R(-2.4,-1.5,4.8,.65,'#000')+R(-2.4,-.33,4.8,.65,'#000')+R(-2.4,.85,4.8,.65,'#000')}</g>`;
const UK=R(0,0,30,20,'#012169')+'<path d="M0,0 30,20 M30,0 0,20" stroke="#fff" stroke-width="4"/><path d="M0,0 30,20 M30,0 0,20" stroke="#c8102e" stroke-width="1.4"/>'+R(12.5,0,5,20,'#fff')+R(0,7.5,30,5,'#fff')+R(13.5,0,3,20,'#c8102e')+R(0,8.5,30,3,'#c8102e');
const usStars=()=>{let s='';for(let r=0;r<5;r++)for(let c=0;c<6;c++)s+=C((1.2+c*1.95).toFixed(2),(1.2+r*2.1).toFixed(2),.45,'#fff');return s};
const veStars=()=>{let s='';for(let k=0;k<8;k++){const a=(200+k*20)*Math.PI/180;s+=S((15+4.6*Math.cos(a)).toFixed(2),(13.6+4.6*Math.sin(a)).toFixed(2),.65,'#fff')}return s};

/* ---------- vista: juego ---------- */
function start(key){
 const g=GAMES[key];
 const deck=shuffle(g.pool).slice(0,TOTAL).map(item=>({item,opts:shuffle([item[g.key],...shuffle(g.pool.filter(p=>p!==item)).slice(0,2).map(p=>p[g.key])])}));
 st={key,g,deck,i:0,score:0,answers:[],done:false};
 document.body.style.setProperty('--accent',g.accent);
 routeEl.textContent='/'+key;
 app.innerHTML=`<div class="wrap"><section class="board">
  <div class="hud"><a class="back" href="#inicio">← Inicio</a><h1>${g.title}</h1>
   <div class="score" id="score"><b id="pts">0</b>puntos</div></div>
  <div class="prog"><span id="count"></span><div class="dots" id="dots"></div></div>
  <div class="stage" id="stage"></div>
  <div class="opts" id="opts"></div>
  <button class="next" id="next" hidden>Siguiente carta</button>
  <p class="hint">Atajos: teclas 1, 2, 3 para responder · Enter para continuar</p>
 </section></div>`;
 document.getElementById('next').addEventListener('click',next);
 card();
}
function dots(){
 document.getElementById('dots').innerHTML=Array.from({length:TOTAL},(_,k)=>{const a=st.answers[k];return `<span class="${a?(a.ok?'ok':'bad'):(k===st.i?'now':'')}"></span>`}).join('');
 document.getElementById('count').textContent=`Carta ${st.i+1} de ${TOTAL}`;
}
function card(){
 const {item,opts}=st.deck[st.i], flag=st.key==='flagflip';
 const front=flag
  ? `<span class="tag">PAÍS</span><div class="flagbox">${flagSvg(item)}</div><div class="name">${item.country}</div><p class="q">${st.g.q}</p>`
  : `<div class="scene">${sceneSvg(item)}</div><p class="q">${st.g.q}</p>`;
 document.getElementById('stage').innerHTML=`<div class="card enter" id="card"><div class="face">${front}</div><div class="face backf" id="backf"></div></div>`;
 document.getElementById('opts').innerHTML=opts.map((o,k)=>`<button class="opt" data-v="${o}"><kbd>${k+1}</kbd>${o}</button>`).join('');
 document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.v)));
 document.getElementById('next').hidden=true;
 st.locked=false; dots();
}
function answer(v){
 if(st.locked)return; st.locked=true;
 const {item}=st.deck[st.i], right=item[st.g.key], ok=v===right, flag=st.key==='flagflip';
 st.answers.push({item,picked:v,ok});
 if(ok){st.score+=PTS;const s=document.getElementById('score');document.getElementById('pts').textContent=st.score;s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump')}
 const back=document.getElementById('backf');
 back.classList.add(ok?'ok':'bad');
 back.innerHTML=(ok?icoOk:icoBad)+`<div class="verdict">${ok?'¡Correcto!':'Incorrecto'}</div>`+
  (flag?`<div class="mini-flag">${flagSvg(item)}</div><p class="ans">La capital de ${item.country} es<b>${item.capital}</b></p>`
       :`<p class="ans">Este lugar es<b>${item.name}</b>${item.where}</p>`)+
  `<span class="pts">${ok?'+'+PTS+' puntos':'Elegiste: '+v}</span>`;
 document.getElementById('card').classList.remove('enter');
 requestAnimationFrame(()=>document.getElementById('card').classList.add('flipped'));
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===right)b.classList.add('right');else if(b.dataset.v===v)b.classList.add('wrong');else b.classList.add('dim')});
 const n=document.getElementById('next'); n.textContent=st.i===TOTAL-1?'Ver resultado':'Siguiente carta'; n.hidden=false; n.focus({preventScroll:true});
 st.i===TOTAL-1?dotsFinal():dots();
}
function dotsFinal(){document.getElementById('dots').innerHTML=st.answers.map(a=>`<span class="${a.ok?'ok':'bad'}"></span>`).join('')}
function next(){ if(!st.locked)return; if(st.i===TOTAL-1)return result(); st.i++; card(); }

/* ---------- vista: resultado ---------- */
function result(){
 st.done=true;
 const hits=st.answers.filter(a=>a.ok).length, flag=st.key==='flagflip';
 const prev=best(st.key); saveBest(st.key,st.score);
 const msg=hits===10?'¡Perfecto, eres un experto!':hits>=8?'¡Excelente partida!':hits>=5?'¡Bien hecho, vas por buen camino!':'¡Sigue practicando!';
 routeEl.textContent='/'+st.key+'/resultado';
 app.innerHTML=`<div class="wrap"><section class="res">
  <div class="medal"><b>${hits}/10</b><span>aciertos</span></div>
  <h2>${msg}</h2>
  <p class="sub">Obtuviste <strong>${st.score} puntos</strong> en ${st.g.title}${st.score>prev?' · ¡Nuevo récord!':' · Récord: '+Math.max(prev,st.score)+' pts'}</p>
  <div class="actions"><button class="play" id="again">Jugar otra vez</button><a class="play ghost" href="#inicio">Cambiar de juego</a></div>
  <div class="review">${st.answers.map(a=>`<div class="rv ${a.ok?'':'bad'}"><div class="th">${flag?flagSvg(a.item):sceneSvg(a.item)}</div><div><b>${flag?a.item.country+': '+a.item.capital:a.item.name}</b><small>${a.ok?'Acertaste':'Respondiste '+a.picked}</small></div></div>`).join('')}</div>
 </section></div>`;
 document.getElementById('again').addEventListener('click',()=>start(st.key));
 window.scrollTo(0,0);
}

/* ---------- router ---------- */
function route(){
 const h=location.hash.slice(1);
 if(GAMES[h])start(h); else home();
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{
 if(!st||st.done||!GAMES[location.hash.slice(1)])return;
 if(['1','2','3'].includes(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1];if(b&&!b.disabled)b.click()}
 if(e.key==='Enter'&&st.locked&&document.activeElement.id!=='next'){e.preventDefault();next()}
});
route();
}
</script>
</body>
</html>
